name: linjian
services:
  postgres:
    image: ${LINJIAN_POSTGRES_IMAGE:-postgres:17-bookworm}
    environment:
      POSTGRES_DB: ${LINJIAN_DATABASE_NAME:-linjian}
      POSTGRES_USER: ${LINJIAN_DATABASE_USER:-linjian}
      POSTGRES_PASSWORD: ${LINJIAN_DATABASE_PASSWORD:?Set an independent database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    image: ${LINJIAN_API_IMAGE:-linjian-api:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LINJIAN_MEDIA_ROOT: /data/media
      LINJIAN_SCHOOL_CHANGE_POLICY_FILE: ${LINJIAN_SCHOOL_CHANGE_POLICY_FILE:-}
      LINJIAN_MEDIA_MAX_IMAGE_BYTES: ${LINJIAN_MEDIA_MAX_IMAGE_BYTES:-5242880}
      LINJIAN_MEDIA_MAX_WIDTH: ${LINJIAN_MEDIA_MAX_WIDTH:-8192}
      LINJIAN_MEDIA_MAX_HEIGHT: ${LINJIAN_MEDIA_MAX_HEIGHT:-8192}
      LINJIAN_MEDIA_MAX_PIXELS: ${LINJIAN_MEDIA_MAX_PIXELS:-24000000}
      LINJIAN_MEDIA_DECODE_CONCURRENCY: ${LINJIAN_MEDIA_DECODE_CONCURRENCY:-2}
      LINJIAN_MEDIA_ORPHAN_GRACE_HOURS: ${LINJIAN_MEDIA_ORPHAN_GRACE_HOURS:-24}
      LINJIAN_MEDIA_UNBOUND_TTL_HOURS: ${LINJIAN_MEDIA_UNBOUND_TTL_HOURS:-24}
      LINJIAN_MEDIA_ARTWORK_UNBOUND_TTL_HOURS: ${LINJIAN_MEDIA_ARTWORK_UNBOUND_TTL_HOURS:-168}
      LINJIAN_MEDIA_DRAFT_LEASE_DAYS: ${LINJIAN_MEDIA_DRAFT_LEASE_DAYS:-30}
      LINJIAN_MEDIA_CLEANUP_BATCH_SIZE: ${LINJIAN_MEDIA_CLEANUP_BATCH_SIZE:-100}
      LINJIAN_BIND_ADDR: 0.0.0.0:8080
      LINJIAN_DATABASE_HOST: ${LINJIAN_DATABASE_HOST:-postgres}
      LINJIAN_DATABASE_PORT: ${LINJIAN_DATABASE_PORT:-5432}
      LINJIAN_DATABASE_NAME: ${LINJIAN_DATABASE_NAME:-linjian}
      LINJIAN_DATABASE_USER: ${LINJIAN_DATABASE_USER:-linjian}
      LINJIAN_DATABASE_PASSWORD: ${LINJIAN_DATABASE_PASSWORD:?Set an independent database password}
      LINJIAN_DATABASE_SSL_MODE: ${LINJIAN_DATABASE_SSL_MODE:-prefer}
      LINJIAN_DATABASE_MAX_CONNECTIONS: ${LINJIAN_DATABASE_MAX_CONNECTIONS:-10}
      LINJIAN_ADMIN_WEB_ORIGIN: ${LINJIAN_ADMIN_WEB_ORIGIN:?Set the management browser origin}
      LINJIAN_BROWSER_ORIGINS: ${LINJIAN_BROWSER_ORIGINS:-}
      LINJIAN_OFFICIAL_ACCOUNT_WEB_ORIGIN: ${LINJIAN_OFFICIAL_ACCOUNT_WEB_ORIGIN:-}
      LINJIAN_COMMUNITY_WEB_ORIGIN: ${LINJIAN_COMMUNITY_WEB_ORIGIN:-}
      LINJIAN_API_PUBLIC_ORIGIN: ${LINJIAN_API_PUBLIC_ORIGIN:?Set the public API origin}
      LINJIAN_TRUSTED_PROXY_IPS: ${LINJIAN_TRUSTED_PROXY_IPS:-}
      LINJIAN_INSECURE_LOCAL_AUTH: ${LINJIAN_INSECURE_LOCAL_AUTH:-false}
      LINJIAN_WX_APP_ID: ${LINJIAN_WX_APP_ID:-}
      LINJIAN_WX_SECRET: ${LINJIAN_WX_SECRET:-}
      LINJIAN_MINIAPP_SOURCE_ENABLED: ${LINJIAN_MINIAPP_SOURCE_ENABLED:-true}
      LINJIAN_MINIAPP_LINK_TYPE: ${LINJIAN_MINIAPP_LINK_TYPE:-short_link}
      LINJIAN_MINIAPP_SHORT_LINK_PERMANENT: ${LINJIAN_MINIAPP_SHORT_LINK_PERMANENT:-false}
      LINJIAN_MINIAPP_URL_LINK_DAYS: ${LINJIAN_MINIAPP_URL_LINK_DAYS:-30}
      LINJIAN_MINIAPP_LINK_MIN_REMAINING_SECONDS: ${LINJIAN_MINIAPP_LINK_MIN_REMAINING_SECONDS:-86400}
      LINJIAN_MINIAPP_PREPARATION_CONCURRENCY: ${LINJIAN_MINIAPP_PREPARATION_CONCURRENCY:-2}
      LINJIAN_STATISTICS_CONCURRENCY: ${LINJIAN_STATISTICS_CONCURRENCY:-2}
      LINJIAN_STATISTICS_TIMEOUT_MS: ${LINJIAN_STATISTICS_TIMEOUT_MS:-15000}
      LINJIAN_STATISTICS_QUEUE_CAPACITY: ${LINJIAN_STATISTICS_QUEUE_CAPACITY:-4096}
      LINJIAN_STATISTICS_BATCH_SIZE: ${LINJIAN_STATISTICS_BATCH_SIZE:-256}
      LINJIAN_STATISTICS_SNAPSHOT_SECONDS: ${LINJIAN_STATISTICS_SNAPSHOT_SECONDS:-600}
      LINJIAN_STATISTICS_RETENTION_MONTHS: ${LINJIAN_STATISTICS_RETENTION_MONTHS:-25}
      LINJIAN_STATISTICS_ACTIVITY_COMPLETE_FROM: ${LINJIAN_STATISTICS_ACTIVITY_COMPLETE_FROM:-}
      LINJIAN_WEKEEPER_ORIGIN: ${LINJIAN_WEKEEPER_ORIGIN:-}
      LINJIAN_WEKEEPER_KEY_ID: ${LINJIAN_WEKEEPER_KEY_ID:-}
      LINJIAN_WEKEEPER_SECRET: ${LINJIAN_WEKEEPER_SECRET:-}
    volumes:
      - media-data:/data/media
      - school-change-data:/data/school-change-documents
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/readyz]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    image: ${LINJIAN_WEB_IMAGE:-linjian-web:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      LINJIAN_WEB_LISTEN: ${LINJIAN_WEB_LISTEN:-:80}
      LINJIAN_API_LISTEN: ${LINJIAN_API_LISTEN:-http://localhost:8081}
      LINJIAN_API_UPSTREAM: ${LINJIAN_API_UPSTREAM:-api:8080}
    ports:
      - ${LINJIAN_WEB_BIND_HOST:-0.0.0.0}:${LINJIAN_HTTP_PORT:-8091}:80
      - ${LINJIAN_WEB_BIND_HOST:-0.0.0.0}:${LINJIAN_HTTPS_PORT:-8444}:443
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  school-change-data:
  media-data:
  postgres-data:
  caddy-data:
  caddy-config:
