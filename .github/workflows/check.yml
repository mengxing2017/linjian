name: Linjian checks
on: [push, pull_request]
jobs:
  forum:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: linjian_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres -d linjian_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev
      - run: make install
      - run: make check-web
      - run: make check-backend
      - run: make test-integration
        env:
          LINJIAN_TEST_DATABASE_URL: postgresql://postgres:isolated-ci-password@localhost:5432/linjian_test
