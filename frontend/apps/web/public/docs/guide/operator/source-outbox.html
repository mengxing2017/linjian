<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Linjian 使用帮助</title><main><h1>Linjian 使用帮助</h1><p>来源发件记录按学校查看发布、编辑与撤回。已收件、素材已更新均不等于群消息已发送。网络与限流错误自动退避；鉴权、路由或版本问题显示阻塞原因。本地状态包括待绑定、待配置、暂停、请求中、等待重试、阻塞与回执处理结束。详情显示原路由、正文冻结时间、关联事件和恢复记录。修复后填写恢复原因，重试同一事件，保持原事件与回执身份；已知回执优先查询。旧协议、终态拒绝、原文损坏与事件冲突不能强制重试。学校暂停保留积压；停用学校仍会处理历史撤回。发送结果以实际回执摘要为准。</p><p><a href="/admin">论坛管理后台</a> · <a href="/community">校园社区</a></p></main></html>
