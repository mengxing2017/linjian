<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Linjian 使用帮助</title><main><h1>Linjian 使用帮助</h1><p>来源发件记录按学校查看消息准备、投递与受理。消息由本项目构造为最多 20 字摘要加换行和原始小程序链接（支持 mp://），完整正文最多 200 个 Unicode 字符。详情展示冻结正文、字符数、构造版本、原路由与恢复记录。已受理不表示实际发送成功，不等待发送状态。网络与限流错误自动退避；确定性内容、鉴权或协议错误显示具体原因。下架、停校与改绑路由只取消未交付消息，不发送上游撤回。修复可恢复错误后填写原因，重试同一事件并保持原始字节；冻结后不能改写正文。</p><p><a href="/admin">论坛管理后台</a> · <a href="/community">校园社区</a></p></main></html>
