<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Linjian 使用帮助</title><main><h1>Linjian 使用帮助</h1><p>操作审计按学校追踪关键变更。平台默认展示配置对学校提供默认资源，学校可配置本校覆盖项。学校屏蔽词管理用于维护本校词条和只读查看平台规则；平台屏蔽词管理仅供平台管理员维护所有学校共用的词条，无需选择学校。两个管理入口均支持相应范围的添加、编辑、删除、启停、导入、查询和排序；启用的平台屏蔽词对所有学校生效，学校屏蔽词仅对本校生效。本校配置不能覆盖平台规则。</p><p><a href="/admin">论坛管理后台</a> · <a href="/community">校园社区</a></p></main></html>
